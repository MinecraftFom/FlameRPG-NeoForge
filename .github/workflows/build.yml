name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 / Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 21 / Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: 配置 Gradle 缓存 / Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 / Build
        run: ./gradlew build --no-daemon --console=plain

      - name: 上传构建产物 / Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlameRPG-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
