modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId = "flamerpg"
version = "${mod_version}"
displayName = "FlameRPG: Core"
authors = "Owner: Fomdev. Code: Fom477"
description = '''
MMORPG for Minecraft Servers
'''
logoFile = "icon.png"

[[mods]]
modId = "frpg_bauble"
version = "${mod_version}"
displayName = "FlameRPG: Bauble"
authors = "Shiroko Sunaookami"
description = '''
Submodule for FlameRPG, aiming to create a bauble system
'''

[[mods]]
modId = "frpg_invasion"
version = "${mod_version}"
displayName = "FlameRPG: Invasion"
authors = "Shimoe Koharu"
description = '''
Submodule for FlameRPG, aiming to being invasions to minecraft
'''

[[mods]]
modId = "frpg_skill"
version = "${mod_version}"
displayName = "FlameRPG: Skill"
authors = "Shimoe Koharu"
description = '''
Submodule for FlameRPG, aiming to create a skill tree
'''
logoFile = "icon.png"

[[mixins]]
config="flamerpg.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.flamerpg]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
